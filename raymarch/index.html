<!DOCTYPE html>
<html>
	<!--Here's a bunch of changes I'm committing to feature 1-->
	<!--Now here's a bunch of changes I'm committing to feature 2-->

	<head>
		<title>Welcome to casting</title>
		<link rel="icon" type="image/x-icon" href="./favicon.png">
		<meta charset="utf-8">
		<style>
			html, body {
				margin: 5px; 
				height: 100%; 
				overflow-y: hidden;
			}
			body {
				background-color: slateblue;
				display: flex;
				font-family: Courier New;
				font-size: 1.5rem;
				height: 100%;
				overflow: hidden;
			}
			
			button {
				background-color: #FFF;
				font-size: 1.5rem;
				padding: 2px 10px 5px 10px;
				border: #111 5px solid;
			}

			button:hover {
				background: #88A;
			}

			#overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.85);
				z-index: 1000;
				align-items: center;
				justify-content: center;
			}

			#grid {
				display: grid;
				grid-gap: 10px;
			}

			.grid-button-1, .grid-button-2 {
				width: 160px;
				height: 80px;
				font-size: 1.3rem;
			}

			.grid-button-2 {
				background: #AF8;
			}

			#group_edit {
				background: slateblue;
				padding: 2em 4em 2em 4em;
				border: #FFF 5px solid;
			}
			
			#wrapper canvas {
				position: absolute;
				top: 0;
				left: 0;
				
				image-rendering: optimizeSpeed;
				image-rendering: -webkit-crisp-edges;
				image-rendering: -moz-crisp-edges;
				image-rendering: -o-crisp-edges;
				image-rendering: crisp-edges;
				image-rendering: -webkit-optimize-contrast;
				image-rendering: optimize-contrast;
				image-rendering: pixelated;
				-ms-interpolation-mode: nearest-neighbor;
			}
			
			#glbox {
				/*enough to still see the image while also knowing something is very wrong and it's not rendering to the banvas, as it should*/
				opacity: 0.3;
			}
	
			#centerModule {
				text-align: center;
				margin: auto;
			}
			
			p {
				user-select: none;
			}

			
			
			#editorPanelGroup {
				float: right;
			}

			.editor-panel {
				position: relative;
				border: #111 2px solid;
				padding: 0.5em;
				margin: 0.5em;
				float: left;
			}
			
			#group_nature {
				padding: 8px 0px 4px 10px;
			}
			
			.sliderGroup {
				display: inline;
			}
			
			.slider {
				width: 600px;
				-webkit-appearance: none;
				height: 10px;
				background: #111;
				margin: 0;
			}
			
			/* custom thumb */
			.slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 25px;
				height: 25px;
				border: #111 5px solid;
				cursor: pointer;
			}
			
			.value {
				width: 10%;
				text-align: center;
				border-right: #e6e4e4 1px solid;
				font-size: 1.5rem;
				font-weight: 600;
				color: #3c3b3b;
			}
			.slider::-moz-range-thumb {
				width: 20px;
				height: 20px;
				border: 0;
				background: #FFFFFF;
				border: #111 5px solid; cursor: pointer;
			}
			
			
			/* checkboxes */
			.checkboxGroup {
				display: inline-block;
				position: relative;
				padding-left: 30px;
				padding-right: 12px;
				cursor: pointer;
				font-size: 22px;
				user-select: none;
			}
			
			/* Hide the browser's default checkbox */
			.checkboxGroup input {
				display: none;
			}
			
			.checkmark {
				position: absolute;
				top: -2.5px;
				left: -2.5px;
				height: 20px;
				width: 20px;
				border: #111 5px solid;
			}
			
			.checkboxGroup:hover input ~ .checkmark {
				background-color: #88A;
			}
			
			.checkboxGroup input:checked ~ .checkmark {
				background-color: #111;
			}
		</style>
		<script src="./common/quaternions.js"></script>
		<script src="./common/functions-coordinate.js"></script>
		<script src="./common/functions-math.js"></script>
		<script src="functions-helper.js"></script>
		<script src="functions-gpu.js"></script>
	
		<script src="config.js"></script>
		<script src="resources/cobble_stone.png"></script>
		<script src="editor.js"></script>
		<script src="editor-components.js"></script>
		<script src="objects-player.js"></script>
		<script src="objects-engine.js"></script>
		<script src="materials.js"></script>
		<script src="objects.js"></script>
		<script src="objects-compound.js"></script>
		<script src="worlds.js"></script>
		<script src="main.js"></script>
	</head>
	<body>
		<div id="wrapper">
			<canvas id="glbox"></canvas>
			<canvas id="viewbox"></canvas>
			<div id="editorPanelGroup" x="600">
				<div class="editor-panel">
					<div>
						<!--avg frame time: <span id="debugMSPF">[!]</span> ms-->
						_tick: <span id="debugCA">[!!]</span> avg / <span id="debugCM">[!!]</span> max<br>
						frame: <span id="debugGA">[!!]</span> avg / <span id="debugGM">[!!]</span> max<br>
						total: <span id="debugTA">[!!]</span> avg / <span id="debugTM">[!!]</span> max<br>
					</div>
					<br>
					<br>
					<div id="group_settings">
					</div>
					<button onclick="screenshot()">Screenshot</button>
				</div>
				<div class="editor-panel">
					<div class="separator">WORLD: <span id="label_world">[!]</span></div>
					<div id="group_world">
					</div>
				</div>
				<div class="editor-panel">
					<div class="separator">MATERIAL: <span id="label_material">[!]</span></div>
					<div id="group_matSpecial">
					</div>
				</div>
				<div class="editor-panel">
					<div class="separator">OBJECT: <span id="label_obj">[!]</span></div>
					<button onclick="editor_preAdd()">+</button>
					<button onclick="editor_removeObj()">-</button>
					<button onclick="editor_loopify()">Toggle Loop</button>
					<div id="group_nature">
					</div>
				</div>
			</div>
			<div id="overlay">
				<div id="grid"></div>
				<div id="group_edit" style="display: none;">
					
				</div>
			</div>

		</div>
	</body>
</html>
